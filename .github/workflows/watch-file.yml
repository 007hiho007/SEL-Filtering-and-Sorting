name: Notify on file change
on:
  push:
    paths:
      - 'Tamtaro-All-Templates-for-AIOStreams.json'
      - 'AIOStreams-SyncedURLs/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "📄 SEL-Filtering-and-Sorting: Eine beobachtete Datei wurde geändert!"}' \
          "${{ secrets.DISCORD_WEBHOOK_URL }}"
