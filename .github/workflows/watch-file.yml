name: Notify on file change
on:
  push:
    paths:
      - 'Tamtaro-All-Templates-for-AIOStreams.json'
      - 'AIOStreams-SyncedURLs/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit-Uebersicht bauen
        id: summary
        run: |
          MSG=$(jq -r '.commits[] | ((.added + .modified + .removed) | map(select(startswith("AIOStreams-SyncedURLs/") or . == "Tamtaro-All-Templates-for-AIOStreams.json"))) as $files | select($files | length > 0) | ("🕒 " + .timestamp + "  ·  👤 " + .author.name + "\n📝 " + (.message | split("\n")[0]) + "\n" + ($files | map("• " + .) | join("\n")) + "\n🔗 " + .url)' "$GITHUB_EVENT_PATH")
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MSG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Diff bauen
        id: diff
        run: |
          DIFF=$(git diff ${{ github.event.before }} ${{ github.sha }} -- AIOStreams-SyncedURLs Tamtaro-All-Templates-for-AIOStreams.json)
          if [ ${#DIFF} -gt 1400 ]; then
            DIFF="${DIFF:0:1400}"$'\n'"... (gekuerzt - vollstaendiger Diff ueber den Commit-Link oben)"
          fi
          echo "diff<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DIFF" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Discord benachrichtigen
        run: |
          jq -n --arg summary "${{ steps.summary.outputs.summary }}" --arg diff "${{ steps.diff.outputs.diff }}" '{content: ($summary + "\n```diff\n" + $diff + "\n```")}' | curl -H "Content-Type: application/json" -d @- "${{ secrets.DISCORD_WEBHOOK_URL }}"
